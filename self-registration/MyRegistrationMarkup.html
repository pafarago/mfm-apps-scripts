  <body>
    <main id="site-content">
      <section class="content-box" role="region" aria-labelledby="title">
        <div class="header-stack">
          <img
            src="https://midlothianfriends.freeddns.org/logo.png"
            alt="Midlothian Friends Meeting logo">
          <div class="site-line">Midlothian Friends Meeting</div>
          <div class="sub-line">News Subscription</div>
        </div>

        <h1 id="title" class="visually-hidden">News Subscription</h1>

        <p class="intro">
          Enter your info and press Continue. Check your email to complete your registration.
        </p>

        <form id="sr-form" class="form-wrap" novalidate>
          <div class="field">
            <label for="email">Email <span class="required">*</span></label>
            <input
              id="email"
              type="email"
              required
              inputmode="email"
              autocomplete="email"
              maxlength="30"
              placeholder="name@example.org">
          </div>

          <div class="field">
            <label for="firstName">First name <span class="required">*</span></label>
            <input
              id="firstName"
              type="text"
              required
              autocomplete="given-name"
              maxlength="30"
              placeholder="First">
          </div>

          <div class="field">
            <label for="lastName">Last name <span class="required">*</span></label>
            <input
              id="lastName"
              type="text"
              required
              autocomplete="family-name"
              maxlength="30"
              placeholder="Last">
          </div>

          <!-- U.S. phone only; optional; 14 chars formatted: (AAA) BBB-CCCC -->
          <div class="field">
            <label for="phone">Phone (optional)</label>
            <input
              id="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              maxlength="14"
              placeholder="(804) 658-1234"
              aria-describedby="phoneHelp">
            <div id="phoneHelp">
              U.S. numbers only. If entered, it must be valid and will be formatted automatically.
            </div>
          </div>

          <div class="field">
            <label for="address">Postal address (optional)</label>
            <textarea
              id="address"
              rows="3"
              maxlength="90"
              placeholder="Street, City&#10;State ZIP"></textarea>
          </div>

          <div class="actions">
            <button id="saveBtn"   class="btn btn-primary" type="button">Continue</button>
            <button id="cancelBtn" class="btn"             type="button">Cancel</button>
          </div>

          <div id="msg" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script>
      const saveBtn   = document.getElementById('saveBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const phoneEl   = document.getElementById('phone');
      const addr      = document.getElementById('address');

      saveBtn.addEventListener('click', submitForm);

      // Cancel → replace tab with splash screen
      cancelBtn.addEventListener('click', function(){
        const splash = `
          <style>
            html,body{
              height:100%;
              margin:0;
              font-family:Georgia,"Times New Roman",Times,serif;
              background:#f5f5f7;
              color:#222;
              display:grid;
              place-items:center;
            }
            .splash{
              max-width:720px;
              padding:24px;
              text-align:center;
            }
            .splash h2{
              font-size:clamp(1.25rem,3.5vw,1.75rem);
              margin:0 0 10px;
            }
            .splash p{
              font-size:clamp(1rem,2.8vw,1.15rem);
              margin:0;
            }
          </style>
          <div class="splash">
            <h2>You have successfully canceled your request.</h2>
            <p>You have successfully canceled your request to subscribe to the News from Midlothian Friends Meeting. You can close this tab in your browser.</p>
          </div>`;
        document.documentElement.innerHTML = splash;
      });

      // Address: max 3 lines, 30 chars each
      addr.addEventListener('input', function(){
        let lines = this.value.replace(/\r\n?/g, '\n').split('\n').slice(0,3);
        lines = lines.map(l => l.substring(0,30));
        this.value = lines.join('\n');
      });

      function setMsg(t, isError){
        const el = document.getElementById('msg');
        el.textContent = t || '';
        el.className = isError ? 'error' : '';
      }

      // === U.S. NANP phone normalization (client-side) ===
      function normalizeUSPhoneNANP(raw){
        const s = String(raw || '').trim();
        if(!s) return '';
        const digits = s.replace(/\D+/g, '');
        if(digits.length !== 10) throw new Error('Not a valid phone number');

        const a = digits.slice(0,3);
        const b = digits.slice(3,6);
        const c = digits.slice(6);

        if(!/^[2-9][0-9]{2}$/.test(a)) throw new Error('Not a valid phone number');
        if(/^[2-9]11$/.test(a))        throw new Error('Not a valid phone number');
        if(!/^[2-9][0-9]{2}$/.test(b)) throw new Error('Not a valid phone number');
        if(/^[2-9]11$/.test(b))        throw new Error('Not a valid phone number');

        return '('+a+') '+b+'-'+c; // 14 chars
      }

      // On blur: validate/format, or alert + clear
      phoneEl.addEventListener('blur', function(){
        const raw = phoneEl.value;
        if(!raw) return;
        try{
          phoneEl.value = normalizeUSPhoneNANP(raw);
        }catch(err){
          alert('Not a valid phone number');
          phoneEl.value = '';
        }
      });

      function submitForm(){
        setMsg('');

        const email     = document.getElementById('email').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        let   phone     = phoneEl.value.trim();
        const address   = document.getElementById('address').value;

        if(email.length > 30)     return setMsg('Email max length is 30 characters.', true);
        if(firstName.length > 30) return setMsg('First name max length is 30 characters.', true);
        if(lastName.length > 30)  return setMsg('Last name max length is 30 characters.', true);
        if(address.length > 90)   return setMsg('Postal address max length is 90 characters.', true);

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email)                 return setMsg('Email is required.', true);
        if (!emailRegex.test(email)) return setMsg('Please enter a valid email address.', true);
        if (!firstName)             return setMsg('First name is required.', true);
        if (!lastName)              return setMsg('Last name is required.', true);

        // Optional phone: if present, normalize once more; if invalid, drop it.
        if (phone){
          try{
            phone = normalizeUSPhoneNANP(phone);
          }catch(err){
            phone = '';
          }
        }

        setMsg('Submitting…');

        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          return setMsg('Client error: Apps Script API not available.', true);
        }

        google.script.run
          .withSuccessHandler(function (responseText) {
            setMsg(responseText || 'Thank you. Please check your email to confirm your subscription.');
            document.getElementById('sr-form').reset();
          })
          .withFailureHandler(function (err) {
            setMsg('Error: ' + (err && err.message ? err.message : err), true);
          })
          .selfRegSubmit({ email, firstName, lastName, phone, address });
      }
    </script>
  </body>
